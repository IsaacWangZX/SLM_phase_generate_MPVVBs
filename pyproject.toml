[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpvvb"
version = "1.0.0"
description = "SLM phase maps and simulation of multipolar perfect vector vortex beams"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "matplotlib", "pillow"]

[project.scripts]
mpvvb = "mpvvb.cli:main"

[tool.setuptools]
packages = ["mpvvb"]
